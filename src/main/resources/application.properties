spring.application.name=super-fiesta

server.port=8080

# Perfil activo por defecto
spring.profiles.active=dev

# Caché en memoria RAM
spring.cache.type=simple

# Documentación OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# H2 en memoria para desarrollo
spring.datasource.url=jdbc:h2:mem:animedevdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 activa
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 aislada en memoria para tests
spring.datasource.url=jdbc:h2:mem:animetestdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 desactivada
spring.h2.console.enabled=false

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 persistente en fichero local
spring.datasource.url=jdbc:h2:file:./data/animeproddb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:SuperFiestaProd!}

# Consola web de H2 desactivada por seguridad
spring.h2.console.enabled=false

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
